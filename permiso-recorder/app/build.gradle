plugins {
    id 'com.android.application'
}
android {
    namespace 'ph.com.smnhs.permiso.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'ph.com.smnhs.permiso.recorder'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Pull-to-refresh while preserving the existing scanner WebView.
dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
