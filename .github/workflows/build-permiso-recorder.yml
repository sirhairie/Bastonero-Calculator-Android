name: Build PERMISO Recorder APK

on:
  push:
    branches:
      - permiso-recorder-v1
    paths:
      - 'permiso-recorder/**'
      - '.github/workflows/build-permiso-recorder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Compile Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: permiso-recorder
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PERMISO-Recorder-v1.5.1-debug-APK
          path: permiso-recorder/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # GitHub Releases provides a single .apk link that installs without ZIP extraction
      # or a GitHub login. The APK remains debug-signed for testing, not Play Store release.
      - name: Publish direct APK download on GitHub Releases
        if: github.ref == 'refs/heads/permiso-recorder-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" permiso-recorder/app/build.gradle)"
          test -n "$APP_VERSION"
          RELEASE_TAG="permiso-recorder-v$APP_VERSION"
          APK_NAME="PERMISO-Recorder-v$APP_VERSION.apk"
          cp permiso-recorder/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "PERMISO Recorder Android v$APP_VERSION" \
              --notes "Direct-install Android APK. This APK is debug-signed and intended for internal testing. Download the APK file directly to your phone; no ZIP extraction is needed." \
              --latest=false
          fi
