name: Build Bastonero APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q Bastonero_Android_Project.zip -d project

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > project/gradle.properties
          echo "android.enableJetifier=true" >> project/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Calculator-APK
          path: Bastonero_Calculator_v1.0.apk
          if-no-files-found: error
