name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero assets
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png

          cat native/test19/photo.part* | base64 -d > native/app/src/main/res/drawable/developer_photo.jpg
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('native/app/src/main/res/drawable/developer_photo.jpg')
          data=p.read_bytes()
          if len(data)==16213:
              data=data[:155]+bytes.fromhex('2c2c2c')+data[155:]
              p.write_bytes(data)
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='82e93a2de41e7078a66ee11db761d2c8fa494d4c05c2d6ad1600cbea9f372647'
          if digest != expected:
              raise SystemExit(f'Developer portrait checksum mismatch: {digest}')
          print('Developer portrait verified:', digest)
          PY

          test -s native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/developer_photo.jpg

      - name: Assemble TEST 25 HD result native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          python3 native/test7/patch.py
          python3 native/test8/patch.py
          python3 native/test9/patch.py
          python3 native/test9/hotfix.py
          python3 native/test10/patch.py
          python3 native/test11/patch.py
          python3 native/test12/patch.py
          python3 native/test13/patch.py
          python3 native/test14/patch.py
          python3 native/test15/patch.py
          python3 native/test16/patch.py
          python3 native/test17/patch.py
          python3 native/test18/patch.py
          cat native/test19/patch.part* > /tmp/test19.py
          python3 /tmp/test19.py
          python3 native/test20/patch.py
          python3 native/test21/patch.py
          python3 native/test22/patch.py
          python3 native/test23/patch.py
          python3 native/test24/patch.py
          python3 native/test25/patch.py

          SRC=native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s "$SRC"
          if grep -q "android.webkit.WebView" "$SRC"; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi

          # Preserve scoring, official result locking, confirmations and premium save flow.
          grep -Fq 'boolean hasLockedResult = false;' "$SRC"
          grep -Fq 'private ScoreData lockedScoreData(Entry e)' "$SRC"
          grep -Fq 'private void commitLockedResult(Entry e)' "$SRC"
          grep -Fq 'premiumConfirm("Update Result","Are you sure you want to update this result?"' "$SRC"
          grep -Fq 'premiumConfirm("Edit Registration","Are you sure you want to edit this registration?"' "$SRC"
          grep -Fq 'final Dialog loading=showSavingDialog();' "$SRC"
          grep -Fq 'long wait=2000-(System.currentTimeMillis()-started);' "$SRC"
          grep -Fq 'Result Successfully Saved' "$SRC"

          # Preserve TEST 23 About page.
          grep -Fq 'DEVELOPER INFORMATION' "$SRC"
          grep -Fq 'photoOval.setShape(android.graphics.drawable.GradientDrawable.OVAL)' "$SRC"
          grep -Fq 'Bitmap safePortrait=Bitmap.createBitmap(developerBitmap,cropX,0,side,side);' "$SRC"
          grep -Fq 'portraitRing.setStroke(dp(3),GOLD_2);' "$SRC"
          grep -Fq 'aboutSection("CHAPERON & COACHING SUPPORT",R.drawable.ic_group)' "$SRC"
          grep -Fq 'TextView chapName=text("Analyn F. Patacsil",15,WHITE,true);' "$SRC"
          grep -Fq 'TextView coachName=text("Leonila M. Umpad",15,WHITE,true);' "$SRC"
          grep -Fq 'WITH APPRECIATION' "$SRC"
          grep -Fq 'THE ARNIS GIRLS' "$SRC"
          grep -Fq 'CORE FEATURES' "$SRC"

          # Preserve approved TEST 24 portrait result layout.
          grep -Fq 'final int width=1080;' "$SRC"
          grep -Fq 'drawTextCenteredFit(cv,p,"Bastonero Calculator",width/2f,y+201,50,GOLD_LIGHT,true,940);' "$SRC"
          grep -Fq 'drawTextCenteredFit(cv,p,"Official Tournament Result",width/2f,y+252,34,WHITE,true,940);' "$SRC"
          grep -Fq 'float metricW=(innerRight-innerLeft-gap)/2f;' "$SRC"
          grep -Fq 'float judgeY=y+424;' "$SRC"
          grep -Fq 'REPEAT PERFORMANCE REQUIRED' "$SRC"
          grep -Fq 'Develop by Sir Hairie Laysam' "$SRC"

          # TEST 25: 2X HD export and ranking-matched medal resource/proportions.
          grep -Fq 'final int exportScale=2;' "$SRC"
          grep -Fq 'Bitmap.createBitmap(width*exportScale,height*exportScale,Bitmap.Config.ARGB_8888)' "$SRC"
          grep -Fq 'cv.scale(exportScale,exportScale);' "$SRC"
          grep -Fq 'float unit=Math.min(w/82f,h/86f);' "$SRC"
          grep -Fq 'float iconSize=68f*unit;' "$SRC"
          grep -Fq 'float glowR=26f*unit;' "$SRC"
          grep -Fq 'float coinR=17f*unit;' "$SRC"
          grep -Fq 'Drawable medal=getDrawable(R.drawable.ic_medal);' "$SRC"
          grep -Fq 'medal.setTint(accent);' "$SRC"
          grep -Fq 'drawText(cv,p,String.valueOf(rank),cx,medalCy+6f*unit,16f*unit,BG,true,Paint.Align.CENTER);' "$SRC"
          grep -Fq 'TEST 25 Ranking-Matched Medal + 2X HD Result Export' "$SRC"

          # Reject TEST 24's hand-built ribbon medal.
          if grep -Fq 'Path leftRibbon=new Path();' "$SRC"; then
            echo "Old TEST 24 ribbon medal remains; refusing TEST 25 build"
            exit 1
          fi
          if grep -Fq 'TextView about=text("ABOUT"' "$SRC"; then
            echo "ABOUT label returned; refusing TEST 25 build"
            exit 1
          fi

          grep -Fq 'android:label="Bastonero Calculator"' native/app/src/main/AndroidManifest.xml
          grep -Fq "applicationId 'com.bastonero.calculator.nativeapp.test25'" native/app/build.gradle
          grep -Fq "versionCode 20025" native/app/build.gradle
          grep -Fq "versionName '2.0-native-test25'" native/app/build.gradle
          test -s native/app/src/main/res/drawable/developer_photo.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST25.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST25
          path: Bastonero_Calculator_Native_v2.0_TEST25.apk
          if-no-files-found: error
