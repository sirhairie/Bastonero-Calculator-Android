name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero brand logo
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/brand_logo.png

      - name: Assemble TEST 11 refined registration native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          python3 native/test7/patch.py
          python3 native/test8/patch.py
          python3 native/test9/patch.py
          python3 native/test9/hotfix.py
          python3 native/test10/patch.py
          python3 native/test11/patch.py
          SRC=native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s "$SRC"
          if grep -q "android.webkit.WebView" "$SRC"; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi
          grep -Fq 'String[] scores = {"","","","",""};' "$SRC"
          grep -Fq 'TextView title = text("Bastonero Calculator",16,WHITE,true);' "$SRC"
          grep -Fq 'Button add=primaryButton("Add Competition",GREEN);' "$SRC"
          grep -Fq 'Button open=primaryButton("Open Competition",BLUE_2);' "$SRC"
          grep -Fq 'showPremiumSpinnerPopup' "$SRC"
          grep -Fq 'applyPremiumSpinnerItems' "$SRC"
          grep -Fq 'heading.setGravity(Gravity.CENTER_HORIZONTAL)' "$SRC"
          grep -Fq 'private LinearLayout iconActionButton(int iconRes,int fill)' "$SRC"
          grep -Fq 'Button reopen=primaryButton("Edit Registration",GREEN);' "$SRC"
          grep -Fq 'TextView label=text("J"+(idx+1),10,MUTED,true);' "$SRC"
          grep -Fq 'final Dialog d=new Dialog(this);' "$SRC"
          grep -Fq 'panel=darkCard(GOLD)' "$SRC"
          grep -Fq 'LinearLayout add=iconActionButton(R.drawable.ic_add,BLUE_2)' "$SRC"
          grep -Fq 'LinearLayout edit=iconActionButton(R.drawable.ic_edit,BLUE_2)' "$SRC"
          grep -Fq 'LinearLayout remove=iconActionButton(R.drawable.ic_delete,RED)' "$SRC"
          grep -Fq 'TEST 11 Icon Actions + Premium Registration Dialog' "$SRC"
          grep -Fq 'private void showRanking()' "$SRC"
          if grep -Fq 'Button edit=outlineIconButton("Edit Competition"' "$SRC"; then
            echo "Text Edit Competition control still present; refusing TEST 11 build"
            exit 1
          fi
          if grep -Fq 'Button del=outlineIconButton("Delete"' "$SRC"; then
            echo "Text Delete control still present; refusing TEST 11 build"
            exit 1
          fi
          if grep -Fq 'Button edit=outlineButton("Edit",GREEN)' "$SRC"; then
            echo "Text roster Edit control still present; refusing TEST 11 build"
            exit 1
          fi
          if grep -Fq 'Button remove=outlineButton("Remove",RED)' "$SRC"; then
            echo "Text roster Remove control still present; refusing TEST 11 build"
            exit 1
          fi
          test -s native/app/src/main/res/drawable/ic_home.xml
          test -s native/app/src/main/res/drawable/ic_info.xml
          test -s native/app/src/main/res/drawable/ic_edit.xml
          test -s native/app/src/main/res/drawable/ic_delete.xml
          test -s native/app/src/main/res/drawable/ic_add.xml
          test -s native/app/src/main/res/drawable/ic_medal.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST11.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST11
          path: Bastonero_Calculator_Native_v2.0_TEST11.apk
          if-no-files-found: error
