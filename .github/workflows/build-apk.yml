name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero brand logo
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/brand_logo.png

      - name: Assemble TEST 6 precision native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          test -s native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          if grep -q "android.webkit.WebView" native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi
          grep -Fq 'String[] scores = {"","","","",""};' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          grep -Fq 'Native Android • TEST 6' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          grep -Fq 'private void showRanking()' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          grep -Fq 'private FrameLayout medalCoin' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          grep -Fq 'private LinearLayout navChip' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          grep -Fq 'final Dialog d=new Dialog(this);' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          grep -Fq 'TEST 6 Precision UI' native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s native/app/src/main/res/drawable/ic_medal.xml
          test -s native/app/src/main/res/drawable/ic_sticks.xml
          test -s native/app/src/main/res/drawable/ic_trophy.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST6.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST6
          path: Bastonero_Calculator_Native_v2.0_TEST6.apk
          if-no-files-found: error
