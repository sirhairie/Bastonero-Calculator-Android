name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero brand logo
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/brand_logo.png

      - name: Assemble TEST 17 premium-confirmation native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          python3 native/test7/patch.py
          python3 native/test8/patch.py
          python3 native/test9/patch.py
          python3 native/test9/hotfix.py
          python3 native/test10/patch.py
          python3 native/test11/patch.py
          python3 native/test12/patch.py
          python3 native/test13/patch.py
          python3 native/test14/patch.py
          python3 native/test15/patch.py
          python3 native/test16/patch.py
          python3 native/test17/patch.py
          SRC=native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s "$SRC"
          if grep -q "android.webkit.WebView" "$SRC"; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi

          # Preserve official result locking from TEST 13.
          grep -Fq 'boolean hasLockedResult = false;' "$SRC"
          grep -Fq 'boolean resultLocked = false;' "$SRC"
          grep -Fq 'String[] lockedScores = {"","","","",""};' "$SRC"
          grep -Fq 'private ScoreData lockedScoreData(Entry e)' "$SRC"
          grep -Fq 'private void commitLockedResult(Entry e)' "$SRC"
          grep -Fq 'Button action=primaryButton(e.resultLocked?"Update Result":"Calculate",e.resultLocked?RED:BLUE_2);' "$SRC"
          grep -Fq 'commitLockedResult(e);saveState();toast("Result calculated and locked")' "$SRC"

          # Preserve TEST 15/16 ranking design and score grid.
          grep -Fq 'Button ranking=primaryButton("View Ranking",BLUE_2);' "$SRC"
          grep -Fq 'TextView title=text("RANKING",20,BG,true);' "$SRC"
          grep -Fq 'top.addView(medal,new LinearLayout.LayoutParams(dp(82),dp(86)));' "$SRC"
          grep -Fq 'ImageView medal=iconView(R.drawable.ic_medal,accent,68);' "$SRC"
          grep -Fq 'rankingMetric("REMOVED H&L",fmt1(r.data.high)+" | "+fmt1(r.data.low),WHITE)' "$SRC"
          grep -Fq 'private View rankingJudgeBox(String label,String value)' "$SRC"
          grep -Fq 'private View rankingTieTotalBox(String value)' "$SRC"
          grep -Fq 'TextView l=text("5-JUDGE TOTAL SCORE",8,GOLD_LIGHT,true);' "$SRC"
          grep -Fq 'REPEAT PERFORMANCE REQUIRED' "$SRC"

          # TEST 17 ranking cleanup.
          grep -Fq 'if(!repeat){' "$SRC"
          grep -Fq 'LinearLayout resultActions=row();' "$SRC"
          grep -Fq 'resultActions.addView(back,new LinearLayout.LayoutParams(0,dp(52),1f));' "$SRC"
          grep -Fq 'resultActions.addView(save,saveP);' "$SRC"

          # TEST 17 guarded Update Result and Edit Registration.
          grep -Fq 'premiumConfirm("Update Result","Are you sure you want to update this result?",R.drawable.ic_edit,"No","Yes",GREEN' "$SRC"
          grep -Fq 'premiumConfirm("Edit Registration","Are you sure you want to edit this registration?",R.drawable.ic_edit,"No","Yes",GREEN' "$SRC"

          # TEST 17 premium destructive confirmations.
          grep -Fq 'private void premiumConfirm(String title,String message,int iconRes,String negativeLabel,String positiveLabel,int positiveColor,Runnable onConfirm)' "$SRC"
          grep -Fq 'LinearLayout panel=darkCard(GOLD);' "$SRC"
          grep -Fq 'negative.setBackground(round(Color.rgb(7,27,48),dp(11),BLUE_2));' "$SRC"
          grep -Fq 'premiumConfirm("Remove "+entryLabel(c)' "$SRC"
          grep -Fq 'premiumConfirm("Delete Competition","Delete "+c.meet+" and all scoring data?"' "$SRC"
          grep -Fq 'TEST 17 Premium Confirmation UX + Ranking Action Cleanup' "$SRC"

          # Reject the old direct unlock and stock destructive AlertDialogs.
          if grep -Fq 'if(e.resultLocked){e.resultLocked=false;saveState();refreshAt(e.id);return;}' "$SRC"; then
            echo "Update Result still unlocks without confirmation; refusing TEST 17 build"
            exit 1
          fi
          if grep -Fq 'setTitle("Remove "+entryLabel(c)).setMessage' "$SRC"; then
            echo "Stock remove-entry AlertDialog still present; refusing TEST 17 build"
            exit 1
          fi
          if grep -Fq 'setTitle("Delete Competition").setMessage' "$SRC"; then
            echo "Stock delete-competition AlertDialog still present; refusing TEST 17 build"
            exit 1
          fi
          if grep -Fq 'content.addView(back,new LinearLayout.LayoutParams(-1,dp(52)))' "$SRC"; then
            echo "Ranking actions are still stacked; refusing TEST 17 build"
            exit 1
          fi
          if grep -Fq 'View Ranking / Results' "$SRC"; then
            echo "Old ranking button label still present; refusing TEST 17 build"
            exit 1
          fi
          if grep -Fq 'TextView detail=text(r.detail' "$SRC"; then
            echo "Ranking explanation paragraph returned; refusing TEST 17 build"
            exit 1
          fi

          test -s native/app/src/main/res/drawable/ic_home.xml
          test -s native/app/src/main/res/drawable/ic_info.xml
          test -s native/app/src/main/res/drawable/ic_medal.xml
          test -s native/app/src/main/res/drawable/ic_edit.xml
          test -s native/app/src/main/res/drawable/ic_delete.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST17.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST17
          path: Bastonero_Calculator_Native_v2.0_TEST17.apk
          if-no-files-found: error
