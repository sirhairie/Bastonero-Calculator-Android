name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero brand logo
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/brand_logo.png

      - name: Assemble TEST 12 registration-UX native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          python3 native/test7/patch.py
          python3 native/test8/patch.py
          python3 native/test9/patch.py
          python3 native/test9/hotfix.py
          python3 native/test10/patch.py
          python3 native/test11/patch.py
          python3 native/test12/patch.py
          SRC=native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s "$SRC"
          if grep -q "android.webkit.WebView" "$SRC"; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi
          grep -Fq 'String[] scores = {"","","","",""};' "$SRC"
          grep -Fq 'showPremiumSpinnerPopup' "$SRC"
          grep -Fq 'applyPremiumSpinnerItems' "$SRC"
          grep -Fq 'Button reopen=primaryButton("Edit Registration",GREEN);' "$SRC"
          grep -Fq 'Button proceed=primaryButton("Proceed to Judge Scoring",BLUE_2);' "$SRC"
          grep -Fq 'TextView num=circleNumber(String.valueOf(index+1),BLUE_2);' "$SRC"
          grep -Fq 'LinearLayout edit=iconActionButton(R.drawable.ic_edit,GREEN);' "$SRC"
          grep -Fq 'LinearLayout remove=iconActionButton(R.drawable.ic_delete,RED);' "$SRC"
          grep -Fq 'words.addView(text(c.date.isEmpty()?"No date":c.date,13,WHITE,true));' "$SRC"
          grep -Fq 'if(!c.venue.isEmpty())words.addView(text(c.venue,11,WHITE,true));' "$SRC"
          grep -Fq 'Button update=primaryButton(d.complete?"Update Result":"Calculate",BLUE_2);' "$SRC"
          grep -Fq 'title.setGravity(Gravity.CENTER);' "$SRC"
          grep -Fq 'sub.setGravity(Gravity.CENTER);' "$SRC"
          grep -Fq 'Button cancel=primaryButton("Cancel",RED);' "$SRC"
          grep -Fq 'actions.addView(save,new LinearLayout.LayoutParams(0,dp(46),1f));' "$SRC"
          grep -Fq 'TEST 12 Registration UX + Clean Competition Workspace' "$SRC"
          grep -Fq 'private void showRanking()' "$SRC"
          if grep -Fq 'Proceed to Judge Scoring   →' "$SRC"; then
            echo "Proceed arrow still present; refusing TEST 12 build"
            exit 1
          fi
          if grep -Fq 'field(isTeam(c)?"TEAM NAME":"COMPETITOR NAME",name)' "$SRC"; then
            echo "Duplicate registration field label still present; refusing TEST 12 build"
            exit 1
          fi
          if grep -Fq 'primaryIconButton(d.complete?"Update Result":"Calculate / Update"' "$SRC"; then
            echo "Old scoring edit-icon button still present; refusing TEST 12 build"
            exit 1
          fi
          test -s native/app/src/main/res/drawable/ic_home.xml
          test -s native/app/src/main/res/drawable/ic_info.xml
          test -s native/app/src/main/res/drawable/ic_edit.xml
          test -s native/app/src/main/res/drawable/ic_delete.xml
          test -s native/app/src/main/res/drawable/ic_add.xml
          test -s native/app/src/main/res/drawable/ic_medal.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST12.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST12
          path: Bastonero_Calculator_Native_v2.0_TEST12.apk
          if-no-files-found: error
