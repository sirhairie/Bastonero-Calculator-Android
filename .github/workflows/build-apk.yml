name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero assets
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png

          # Restore and verify the known-good developer portrait.
          cat native/test19/photo.part* | base64 -d > native/app/src/main/res/drawable/developer_photo.jpg
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('native/app/src/main/res/drawable/developer_photo.jpg')
          data=p.read_bytes()
          if len(data)==16213:
              data=data[:155]+bytes.fromhex('2c2c2c')+data[155:]
              p.write_bytes(data)
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='82e93a2de41e7078a66ee11db761d2c8fa494d4c05c2d6ad1600cbea9f372647'
          if digest != expected:
              raise SystemExit(f'Developer portrait checksum mismatch: {digest}')
          print('Developer portrait verified:', digest)
          PY

          test -s native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/developer_photo.jpg

      - name: Assemble TEST 22 About native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          python3 native/test7/patch.py
          python3 native/test8/patch.py
          python3 native/test9/patch.py
          python3 native/test9/hotfix.py
          python3 native/test10/patch.py
          python3 native/test11/patch.py
          python3 native/test12/patch.py
          python3 native/test13/patch.py
          python3 native/test14/patch.py
          python3 native/test15/patch.py
          python3 native/test16/patch.py
          python3 native/test17/patch.py
          python3 native/test18/patch.py
          cat native/test19/patch.part* > /tmp/test19.py
          python3 /tmp/test19.py
          python3 native/test20/patch.py
          python3 native/test21/patch.py
          python3 native/test22/patch.py
          SRC=native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s "$SRC"
          if grep -q "android.webkit.WebView" "$SRC"; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi

          # Preserve official result locking and existing confirmations.
          grep -Fq 'boolean hasLockedResult = false;' "$SRC"
          grep -Fq 'private ScoreData lockedScoreData(Entry e)' "$SRC"
          grep -Fq 'private void commitLockedResult(Entry e)' "$SRC"
          grep -Fq 'premiumConfirm("Update Result","Are you sure you want to update this result?"' "$SRC"
          grep -Fq 'premiumConfirm("Edit Registration","Are you sure you want to edit this registration?"' "$SRC"
          grep -Fq 'Button negative=primaryButton(negativeLabel,BLUE_2);negative.setTextSize(13);negative.setTextColor(WHITE);' "$SRC"

          # Preserve premium saving feedback and ranking-matched portrait export.
          grep -Fq 'final Dialog loading=showSavingDialog();' "$SRC"
          grep -Fq 'long wait=2000-(System.currentTimeMillis()-started);' "$SRC"
          grep -Fq 'private Dialog showSavingDialog()' "$SRC"
          grep -Fq 'Result Successfully Saved' "$SRC"
          grep -Fq 'drawTextCenteredFit(cv,p,c.meet,width/2f' "$SRC"
          grep -Fq 'drawExportMedal(cv,p,r.rank,accent' "$SRC"
          grep -Fq 'drawExportMetricBox(cv,p,"REMOVED H&L"' "$SRC"
          grep -Fq 'drawExportJudgeBox(cv,p,"J"+(i+1)' "$SRC"
          grep -Fq 'drawExportTieTotal(cv,p,fmt(r.data.fiveTotal)' "$SRC"
          grep -Fq 'REPEAT PERFORMANCE REQUIRED' "$SRC"
          grep -Fq 'Develop by Sir Hairie Laysam' "$SRC"

          # Preserve About sections and working developer photo decode.
          grep -Fq 'Hairie A. Laysam' "$SRC"
          grep -Fq 'THE ARNIS GIRLS' "$SRC"
          grep -Fq 'CORE FEATURES' "$SRC"
          grep -Fq 'Bitmap developerBitmap=BitmapFactory.decodeResource(getResources(),R.drawable.developer_photo);' "$SRC"
          grep -Fq 'LinearLayout storyPanel=aboutSection("PROJECT STORY",R.drawable.ic_info);' "$SRC"
          grep -Fq 'TextView purposeLabel=text("PURPOSE",10,GOLD_2,true);' "$SRC"

          # TEST 22 Developer Information: circular portrait and centered identity below it.
          grep -Fq 'TextView devHead=text("DEVELOPER INFORMATION",13,GOLD_LIGHT,true);' "$SRC"
          grep -Fq 'photoFrame.setBackground(round(Color.rgb(10,32,55),dp(999),GOLD_2));photoFrame.setClipToOutline(true);' "$SRC"
          grep -Fq 'LinearLayout.LayoutParams photoP=new LinearLayout.LayoutParams(dp(154),dp(154));' "$SRC"
          grep -Fq 'TextView devName=text("Hairie A. Laysam",20,WHITE,true);devName.setGravity(Gravity.CENTER);' "$SRC"
          grep -Fq 'TextView role=text("Teacher I",12,GOLD_2,true);role.setGravity(Gravity.CENTER);' "$SRC"
          grep -Fq 'TextView school=text("Sta. Maria National High School",11,MUTED,false);school.setGravity(Gravity.CENTER);' "$SRC"

          # TEST 22 revised origin story.
          grep -Fq 'directly assigned by the school principal to serve as coach of the Arnis Girls' "$SRC"
          grep -Fq 'he had no prior knowledge of Arnis, its competition rules and regulations, or its scoring system' "$SRC"
          grep -Fq 'Icon Jules F. Descallar suggested creating an application' "$SRC"
          grep -Fq 'Mara W. Samson, one of the Arnis Girls, supported the idea' "$SRC"
          grep -Fq 'served as its tester and scoring validator' "$SRC"

          # TEST 22 Chaperon / fellow-coach acknowledgment and people icon for tester.
          grep -Fq 'TextView coachName=text("Leonila M. Umpad",16,WHITE,true);' "$SRC"
          grep -Fq 'TextView coachRole=text("Fellow Coach - Arnis Boys",10,GOLD_2,true);' "$SRC"
          grep -Fq 'With appreciation for their support and assistance to the Arnis Girls during their activities and competitions.' "$SRC"
          grep -Fq 'LinearLayout tester=aboutSection("APP TESTER & SCORING VALIDATION",R.drawable.ic_group);' "$SRC"
          grep -Fq 'TEST 22 Developer Information + Circular Portrait + Revised Story' "$SRC"

          # Reject obsolete About layout/text.
          if grep -Fq 'DEVELOPER & PROJECT STORY' "$SRC"; then
            echo "Old developer heading remains; refusing TEST 22 build"
            exit 1
          fi
          if grep -Fq 'LinearLayout tester=aboutSection("APP TESTER & SCORING VALIDATION",R.drawable.ic_check);' "$SRC"; then
            echo "Old tester check icon remains; refusing TEST 22 build"
            exit 1
          fi
          if grep -Fq 'TextView about=text("ABOUT"' "$SRC"; then
            echo "ABOUT label returned; refusing TEST 22 build"
            exit 1
          fi

          grep -Fq 'android:label="Bastonero Calculator"' native/app/src/main/AndroidManifest.xml
          test -s native/app/src/main/res/drawable/developer_photo.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST22.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST22
          path: Bastonero_Calculator_Native_v2.0_TEST22.apk
          if-no-files-found: error
