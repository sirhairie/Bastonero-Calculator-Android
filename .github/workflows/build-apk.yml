name: Build Bastonero Native APK

on:
  workflow_dispatch:
  push:
    branches: [ native-v2 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native branch
        uses: actions/checkout@v4

      - name: Restore Bastonero brand logo
        run: |
          mkdir -p native/app/src/main/res/drawable
          LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)brand_logo\.png$' | head -n 1 || true)
          if [ -z "$LOGO_PATH" ]; then
            LOGO_PATH=$(unzip -Z1 Bastonero_Android_Project.zip | grep -Ei '(^|/)(app_logo|logo)\.png$' | head -n 1 || true)
          fi
          if [ -z "$LOGO_PATH" ]; then
            echo "Bastonero logo not found in preserved Android project"
            exit 1
          fi
          unzip -p Bastonero_Android_Project.zip "$LOGO_PATH" > native/app/src/main/res/drawable/brand_logo.png
          test -s native/app/src/main/res/drawable/brand_logo.png

      - name: Assemble TEST 18 premium-save native source
        run: |
          mkdir -p native/app/src/main/java/com/bastonero/calculator/nativeapp
          cat native/test4/MainActivity.part* > native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          python3 native/test5/prepare.py
          python3 native/test6/patch.py
          python3 native/test6/hotfix.py
          python3 native/test7/patch.py
          python3 native/test8/patch.py
          python3 native/test9/patch.py
          python3 native/test9/hotfix.py
          python3 native/test10/patch.py
          python3 native/test11/patch.py
          python3 native/test12/patch.py
          python3 native/test13/patch.py
          python3 native/test14/patch.py
          python3 native/test15/patch.py
          python3 native/test16/patch.py
          python3 native/test17/patch.py
          python3 native/test18/patch.py
          SRC=native/app/src/main/java/com/bastonero/calculator/nativeapp/MainActivity.java
          test -s "$SRC"
          if grep -q "android.webkit.WebView" "$SRC"; then
            echo "WebView reference found; refusing native build"
            exit 1
          fi

          # Preserve official result locking from TEST 13.
          grep -Fq 'boolean hasLockedResult = false;' "$SRC"
          grep -Fq 'boolean resultLocked = false;' "$SRC"
          grep -Fq 'String[] lockedScores = {"","","","",""};' "$SRC"
          grep -Fq 'private ScoreData lockedScoreData(Entry e)' "$SRC"
          grep -Fq 'private void commitLockedResult(Entry e)' "$SRC"
          grep -Fq 'Button action=primaryButton(e.resultLocked?"Update Result":"Calculate",e.resultLocked?RED:BLUE_2);' "$SRC"
          grep -Fq 'commitLockedResult(e);saveState();toast("Result calculated and locked")' "$SRC"

          # Preserve ranking design and guarded actions.
          grep -Fq 'private View rankingTieTotalBox(String value)' "$SRC"
          grep -Fq 'REPEAT PERFORMANCE REQUIRED' "$SRC"
          grep -Fq 'LinearLayout resultActions=row();' "$SRC"
          grep -Fq 'premiumConfirm("Update Result","Are you sure you want to update this result?"' "$SRC"
          grep -Fq 'premiumConfirm("Edit Registration","Are you sure you want to edit this registration?"' "$SRC"

          # TEST 18: filled blue Cancel / No controls.
          grep -Fq 'Button negative=primaryButton(negativeLabel,BLUE_2);negative.setTextSize(13);negative.setTextColor(WHITE);' "$SRC"
          if grep -Fq 'negative.setBackground(round(Color.rgb(7,27,48),dp(11),BLUE_2));' "$SRC"; then
            echo "Cancel/No is still outline-only; refusing TEST 18 build"
            exit 1
          fi

          # TEST 18: real save loading + premium success feedback.
          grep -Fq 'final Dialog loading=showSavingDialog();' "$SRC"
          grep -Fq 'new Thread(()->{' "$SRC"
          grep -Fq 'long wait=2000-(System.currentTimeMillis()-started);' "$SRC"
          grep -Fq 'private Dialog showSavingDialog()' "$SRC"
          grep -Fq 'words.addView(text("Saving Result…",19,WHITE,true));' "$SRC"
          grep -Fq 'words.addView(text("Result Successfully Saved",19,WHITE,true));' "$SRC"
          grep -Fq 'Saved to Pictures/Bastonero' "$SRC"
          grep -Fq 'if(ok)showSavedDialog();' "$SRC"

          # TEST 18: portrait premium result export.
          grep -Fq 'int width=1200;' "$SRC"
          grep -Fq 'drawText(cv,p,"BASTONERO",width/2f' "$SRC"
          grep -Fq 'drawText(cv,p,"C A L C U L A T O R",width/2f' "$SRC"
          grep -Fq 'drawText(cv,p,"Official Tournament Result",width/2f' "$SRC"
          grep -Fq 'drawTextFit(cv,p,safeName(r.entry.name)' "$SRC"
          grep -Fq 'drawResultMetric(cv,p,"REMOVED H&L"' "$SRC"
          grep -Fq 'drawResultMetric(cv,p,"VALID SCORE"' "$SRC"
          grep -Fq 'drawResultMetric(cv,p,"PENALTY"' "$SRC"
          grep -Fq 'drawText(cv,p,"FINAL SCORE"' "$SRC"
          grep -Fq 'drawText(cv,p,"5-JUDGE TOTAL SCORE"' "$SRC"
          grep -Fq 'Develop by Sir Hairie Laysam' "$SRC"
          grep -Fq 'TEST 18 Premium Save Experience + Portrait Result Export' "$SRC"

          # Reject obsolete stock success dialog / landscape export text.
          if grep -Fq 'new AlertDialog.Builder(this).setTitle("Result Successfully Saved")' "$SRC"; then
            echo "Stock gray saved dialog returned; refusing TEST 18 build"
            exit 1
          fi
          if grep -Fq 'Official Tournament Result • Native Android' "$SRC"; then
            echo "Native Android label remains in saved result export; refusing TEST 18 build"
            exit 1
          fi
          if grep -Fq 'PRECISION 3D' "$SRC"; then
            echo "Precision 3D label remains; refusing TEST 18 build"
            exit 1
          fi

          test -s native/app/src/main/res/drawable/ic_home.xml
          test -s native/app/src/main/res/drawable/ic_info.xml
          test -s native/app/src/main/res/drawable/ic_medal.xml
          test -s native/app/src/main/res/drawable/ic_edit.xml
          test -s native/app/src/main/res/drawable/ic_delete.xml
          test -s native/app/src/main/res/drawable/ic_check.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native debug APK
        working-directory: native
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp native/app/build/outputs/apk/debug/app-debug.apk Bastonero_Calculator_Native_v2.0_TEST18.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastonero-Native-APK-TEST18
          path: Bastonero_Calculator_Native_v2.0_TEST18.apk
          if-no-files-found: error
